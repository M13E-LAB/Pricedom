; Configuration PHP forcée pour uploads Zyma
; Ce fichier force les limites PHP, même si Railway ignore les variables

upload_max_filesize = 20M
post_max_size = 25M
memory_limit = 256M
max_execution_time = 300
max_input_time = 300
max_file_uploads = 20

; Options supplémentaires pour les gros fichiers
file_uploads = On
allow_url_fopen = On 