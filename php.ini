[PHP]
; Configuration PHP personnalisée pour Zyma
; Force les limites d'upload - Railway ne peut pas ignorer ça !

; === LIMITES D'UPLOAD ===
upload_max_filesize = 20M
post_max_size = 25M
max_file_uploads = 20
file_uploads = On

; === MÉMOIRE ET TEMPS ===
memory_limit = 256M
max_execution_time = 300
max_input_time = 300
max_input_vars = 3000

; === ERREURS ET LOGS ===
log_errors = On
error_log = /tmp/php_errors.log
display_errors = Off
display_startup_errors = Off

; === SESSIONS ===
session.gc_maxlifetime = 7200
session.cookie_httponly = 1
session.cookie_secure = 1

; === OPCACHE ===
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 4000
opcache.revalidate_freq = 60

; === SÉCURITÉ ===
expose_php = Off
allow_url_fopen = On
allow_url_include = Off

; === UPLOADS SPÉCIFIQUES ===
; Configuration forcée pour images de téléphones modernes
upload_tmp_dir = /tmp
auto_detect_line_endings = Off

; === EXTENSIONS REQUISES ===
extension=gd
extension=pdo_pgsql
extension=pgsql 